<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;}
  body{
    background: linear-gradient(135deg, #062612 0%, #0a4d1f 40%, #0f8a3c 100%);
    font-family:'Segoe UI',system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .bg-circles{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  .circle{position:absolute;border-radius:50%;background:rgba(255,255,255,0.04);}
  .c1{width:320px;height:320px;top:-80px;right:-60px;animation:float1 7s ease-in-out infinite;}
  .c2{width:200px;height:200px;bottom:-40px;left:-40px;animation:float2 9s ease-in-out infinite;}
  .c3{width:120px;height:120px;top:40%;left:10%;animation:float1 11s ease-in-out infinite reverse;}
  @keyframes float1{0%,100%{transform:translate(0,0);}50%{transform:translate(15px,-20px);}}
  @keyframes float2{0%,100%{transform:translate(0,0);}50%{transform:translate(-10px,15px);}}

  .content{
    position:relative;z-index:2;
    display:flex;flex-direction:column;align-items:center;
    text-align:center;padding:20px 32px;gap:10px;
  }
  .badge{
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.25);
    color:#fff;font-size:11px;font-weight:700;letter-spacing:2px;
    text-transform:uppercase;padding:5px 16px;border-radius:999px;
    animation:fadeIn 0.6s ease both;
  }
  .title{
    font-size:clamp(22px,5vw,40px);font-weight:900;
    color:#fff;line-height:1.1;letter-spacing:-0.5px;
    animation:slideUp 0.7s 0.1s ease both;
  }
  .title span{color:#8dc63f;}
  .amount{
    font-size:clamp(32px,8vw,64px);font-weight:900;
    background:linear-gradient(135deg,#fff 30%,#8dc63f);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;line-height:1;
    animation:slideUp 0.7s 0.2s ease both;
  }
  .sub{
    color:rgba(255,255,255,0.75);font-size:clamp(12px,2vw,15px);
    font-weight:500;animation:slideUp 0.7s 0.3s ease both;
  }
  .cta{
    margin-top:6px;
    background:linear-gradient(135deg,#1aa84a,#8dc63f);
    color:#fff;font-weight:800;font-size:clamp(11px,2vw,14px);
    letter-spacing:0.5px;padding:10px 28px;border-radius:8px;
    border:none;cursor:pointer;
    box-shadow:0 6px 20px rgba(26,168,74,0.45);
    animation:slideUp 0.7s 0.4s ease both, pulse 2.5s 1.5s ease-in-out infinite;
  }
  @keyframes slideUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes pulse{0%,100%{box-shadow:0 6px 20px rgba(26,168,74,0.45);}50%{box-shadow:0 8px 28px rgba(26,168,74,0.7);}}

  .logo-text{
    font-size:clamp(10px,1.8vw,13px);color:rgba(255,255,255,0.5);
    font-weight:600;letter-spacing:1px;text-transform:uppercase;
    animation:fadeIn 0.6s 0.5s ease both;
  }
</style>
</head>
<body>
  <div class="bg-circles">
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="circle c3"></div>
  </div>
  <div class="content">
    <div class="badge">🎉 Gran Sorteo 2026</div>
    <div class="title">Gana hasta</div>
    <div class="amount">C$ 500,000</div>
    <div class="sub">Participa completando el formulario y gana<br>uno de los <strong style="color:#8dc63f">50 premios</strong> disponibles</div>
    <div class="cta">¡Participa Ahora!</div>
    <div class="logo-text">Banpro Grupo Promerica</div>
  </div>
</body>
</html>
